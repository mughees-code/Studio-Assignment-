
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shutter - Photography</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Roboto', sans-serif;
    background: #fff;
    color: #222;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #000;
    color: #fff;
    position: fixed;
    top: 0;
    left: 0;
    padding: 45px 35px;
}

.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 55px;
}

.logo i {
    margin-right: 8px;
}

.menu {
    list-style: none;
}

.menu li {
    margin: 0 0 25px;
}

.menu a {
    color: #aaa;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    transition: 0.3s;
}

.menu a:hover,
.menu a.active {
    color: #fff;
}

.social {
    position: absolute;
    bottom: 35px;
    left: 35px;
}

.social a {
    color: #aaa;
    margin-right: 13px;
    font-size: 15px;
}

.social a:hover {
    color: #fff;
}

/* MAIN CONTENT */
.main {
    margin-left: 250px;
    padding: 0;
}

.topbar {
    height: 85px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 35px;
    background: #fff;
}

.topbar a {
    color: #222;
    font-size: 19px;
    margin-left: 22px;
}

/* PHOTO GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    padding: 0 5px 5px;
}

.photo {
    height: 260px;
    overflow: hidden;
    background: #eee;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s;
}

.photo:hover img {
    transform: scale(1.06);
}

/* FOOTER */
footer {
    padding: 35px 15px;
    text-align: center;
    font-size: 13px;
    color: #888;
}

footer span {
    color: #e63946;
}

/* RESPONSIVE */
@media (max-width: 1000px) {
    .sidebar {
        width: 210px;
        padding: 35px 25px;
    }

    .main {
        margin-left: 210px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {
    .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 22px 20px;
    }

    .logo {
        margin-bottom: 20px;
    }

    .menu {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
    }

    .menu li {
        margin: 0;
    }

    .social {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .topbar {
        height: 60px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        padding: 0 4px;
    }

    .photo {
        height: 180px;
    }
}

@media (max-width: 380px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .photo {
        height: 240px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">
        <i class="fa-solid fa-camera"></i> SHUTTER
    </div>

    <ul class="menu">
        <li><a href="#" class="active">HOME</a></li>
        <li><a href="#photos">PHOTOS</a></li>
        <li><a href="#bio">BIO</a></li>
        <li><a href="#blog">BLOG</a></li>
        <li><a href="#contact">CONTACT</a></li>
    </ul>

    <div class="social">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>
</aside>

<main class="main">
    <div class="topbar">
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="#"><i class="fa-solid fa-bars"></i></a>
    </div>

    <section class="gallery" id="photos">
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Nature landscape">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=700&q=80" alt="Sunrise landscape">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=700&q=80" alt="Ocean waves">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Forest">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Mountain peaks">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80" alt="Beach">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=700&q=80" alt="Wildlife">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=700&q=80" alt="Night mountains">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=700&q=80" alt="Flowers">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80" alt="Lake and mountains">
        </div>
        <div class="photo">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=700&q=80" alt="Green countryside">
        </div>
    </section>

    <footer>
        Copyright © 2026 All rights reserved |
        Made with <span>♥</span> for photography
    </footer>
</main>

</body>
</html>
